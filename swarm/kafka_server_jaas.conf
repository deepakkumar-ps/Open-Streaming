// Broker-side JAAS.
//
// The PLAIN listeners (SASLPLAIN / SASLSSL / SASLMTLS) get their login module
// inline via KAFKA_LISTENER_NAME_<NAME>_PLAIN_SASL_JAAS_CONFIG, so they do not
// depend on this file.
//
// The SCRAM listener does: Kafka insists on finding a 'KafkaServer' or
// '<listener>.KafkaServer' JAAS entry for a SCRAM-enabled listener even though
// the credentials themselves live in cluster metadata. Without this the broker
// dies at startup with:
//   Could not find a 'KafkaServer' or 'scrammtls.KafkaServer' entry in the
//   JAAS configuration.
//
// No username/password is needed here: those are only required when the broker
// acts as a SCRAM *client* (i.e. when SCRAM is the inter-broker mechanism).
// Ours is PLAINTEXT, so a bare entry is enough. Actual user credentials are
// created by create-scram-users.sh.

scrammtls.KafkaServer {
  org.apache.kafka.common.security.scram.ScramLoginModule required;
};
