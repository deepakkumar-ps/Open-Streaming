networks:
  shared_network:
    external: true

services:
  bridge-service:
    image: atlasplatformdocker/bridge-service-host-dev:2.1.4.35-dev
    ports:
      - "9697:9697"
      - "10010:10010"
    environment:
      TZ: Europe/London
      DOTNET_GCHeapHardLimit: "0xC0000000"
      DOTNET_gcServer: "1"
      DOTNET_gcConcurrent: "1"
      DOTNET_GCConserveMemory: "5"
    networks:
      - shared_network
    volumes:
      - /home/ocsautotest/docker-composes/BridgeService/Configs:/app/Configs
      - /home/ocsautotest/docker-composes/BridgeService/EssentialFiles:/app/Essentials
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == bridge
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          memory: 1G
      restart_policy:
        condition: on-failure
