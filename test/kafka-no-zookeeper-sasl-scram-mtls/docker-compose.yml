networks:
  shared_network:
    external: true

volumes:
  kafka-scram-data:

services:
  # SCRAM credentials live in cluster metadata, not a static JAAS file, and
  # every listener below requires SASL+mTLS from the first boot - so there's
  # no already-authenticated connection available to add the first user via
  # kafka-configs.sh. This one-shot init container bootstraps the SCRAM users
  # directly into the KRaft metadata log via `kafka-storage.sh format
  # --add-scram`, before the broker ever starts. It shares the log-dir volume
  # with the kafka service; the broker's own startup formatting sees storage
  # is already formatted and skips re-formatting.
  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-scram-init
    # Runs as root because the named volume's log dir doesn't pre-exist in the
    # image, so Docker creates it root-owned on first mount. The chown at the
    # end hands it to appuser (uid 1000), the user the "kafka" service runs
    # as, so its later writes still succeed.
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ -f /tmp/kraft-kafka-logs/meta.properties ]; then
          echo "Storage already formatted, skipping."
        else
          /opt/kafka/bin/kafka-storage.sh format \
            --cluster-id local \
            --config /tmp/format.properties \
            --add-scram 'SCRAM-SHA-256=[name=admin,password=admin-secret]' \
            --add-scram 'SCRAM-SHA-256=[name=streamuser,password=stream-secret]'
        fi
        chown -R 1000:1000 /tmp/kraft-kafka-logs
    volumes:
      - kafka-scram-data:/tmp/kraft-kafka-logs
      - ./format.properties:/tmp/format.properties:ro

  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka-broker-1
    networks:
      - shared_network
    ports:
      - "9094:9094"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      CLUSTER_ID: "local"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # Client + inter-broker listeners require BOTH a client certificate (mTLS)
      # and SASL/SCRAM-SHA-256 credentials; controller stays PLAINTEXT
      KAFKA_LISTENERS: "SASL_SSL://:9092,CONTROLLER://:9093,SASL_SSL_HOST://:9094"
      KAFKA_ADVERTISED_LISTENERS: "SASL_SSL://kafka:9092,SASL_SSL_HOST://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL,SASL_SSL_HOST:SASL_SSL"
      KAFKA_INTER_BROKER_LISTENER_NAME: "SASL_SSL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_SASL_ENABLED_MECHANISMS: "SCRAM-SHA-256"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "SCRAM-SHA-256"
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"

      # TLS (PKCS12 stores generated by generate-certs.sh). "required" makes every
      # client present a certificate signed by the CA, on top of SASL auth.
      KAFKA_SSL_CLIENT_AUTH: "required"
      KAFKA_SSL_KEYSTORE_FILENAME: "kafka.keystore.p12"
      KAFKA_SSL_KEYSTORE_CREDENTIALS: "kafka_keystore_creds"
      KAFKA_SSL_KEY_CREDENTIALS: "kafka_key_creds"
      KAFKA_SSL_KEYSTORE_TYPE: "PKCS12"
      KAFKA_SSL_TRUSTSTORE_FILENAME: "kafka.truststore.p12"
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: "kafka_truststore_creds"
      KAFKA_SSL_TRUSTSTORE_TYPE: "PKCS12"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-kafka-logs"
    volumes:
      - kafka-scram-data:/tmp/kraft-kafka-logs
      - ./kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro
      - ./secrets:/etc/kafka/secrets:ro

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui-1
    networks:
      - shared_network
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";'
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: changeit
      # kafka-ui's own client certificate (mTLS)
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka-ui.keystore.p12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEY_PASSWORD: changeit
      DYNAMIC_CONFIG_ENABLED: "true"
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
    depends_on:
      - kafka
