networks:
  shared_network:
    external: true

services:
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka-broker-1
    networks:
      - shared_network
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "local"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # Client + inter-broker listeners use SSL with mandatory client certificates
      # (mutual TLS); controller stays PLAINTEXT
      KAFKA_LISTENERS: "SSL://:9092,CONTROLLER://:9093,SSL_HOST://:9094"
      KAFKA_ADVERTISED_LISTENERS: "SSL://kafka:9092,SSL_HOST://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,SSL:SSL,SSL_HOST:SSL"
      KAFKA_INTER_BROKER_LISTENER_NAME: "SSL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # TLS (PKCS12 stores generated by generate-certs.sh). "required" makes every
      # client present a certificate signed by the CA in the truststore.
      KAFKA_SSL_CLIENT_AUTH: "required"
      KAFKA_SSL_KEYSTORE_FILENAME: "kafka.keystore.p12"
      KAFKA_SSL_KEYSTORE_CREDENTIALS: "kafka_keystore_creds"
      KAFKA_SSL_KEY_CREDENTIALS: "kafka_key_creds"
      KAFKA_SSL_KEYSTORE_TYPE: "PKCS12"
      KAFKA_SSL_TRUSTSTORE_FILENAME: "kafka.truststore.p12"
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: "kafka_truststore_creds"
      KAFKA_SSL_TRUSTSTORE_TYPE: "PKCS12"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-kafka-logs"
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui-1
    networks:
      - shared_network
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: changeit
      # kafka-ui's own client certificate (mTLS)
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka-ui.keystore.p12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEY_PASSWORD: changeit
      DYNAMIC_CONFIG_ENABLED: "true"
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
    depends_on:
      - kafka
