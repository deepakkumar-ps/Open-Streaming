name: Kafka-SASL_Plaintext

services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    container_name: kafka-broker-1

    ports:
      - "9094:9094"

    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      # KRaft controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Internal Docker, controller, and host listeners
      KAFKA_LISTENERS: "SASL_INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,SASL_HOST://0.0.0.0:9094"

      KAFKA_ADVERTISED_LISTENERS: "SASL_INTERNAL://kafka:9092,SASL_HOST://localhost:9094"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,SASL_INTERNAL:SASL_PLAINTEXT,SASL_HOST:SASL_PLAINTEXT"

      # Broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: "SASL_INTERNAL"

      # SASL/PLAIN
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"

      # Load broker JAAS file
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"

      # Single-node settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # Convenient for local testing
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: "/tmp/kraft-kafka-logs"

    volumes:
      - ./kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro

    networks:
      - kafka_net_internal

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-1

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: "local-sasl-kafka"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: "PLAIN"
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="admin-secret";

      DYNAMIC_CONFIG_ENABLED: "true"

    depends_on:
      - kafka

    networks:
      - kafka_net_internal

networks:
  kafka_net_internal:
    driver: bridge